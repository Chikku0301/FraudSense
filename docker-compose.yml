version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fraudsense-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraudsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraudsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fraudsense-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fraudsense
      - JWT_SECRET=super-secret-fraud-sense-key-123456789
      - THRESHOLD_CLEAR=0.3
      - THRESHOLD_BLOCK=0.7
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: fraudsense-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
